name: Deploy to AWS

# Real deployment path: standard ECS Fargate + ALB, managed by
# terraform/ecs.tf. This used to end with an "ECS Deploy Express Mode"
# step targeting a completely different, never-actually-used deployment
# shape (a separate service the Terraform-managed stack has no relation
# to) - it had been silently failing on every push (AWS API flakiness on
# service creation, not a real blocker) rather than actually succeeding,
# which meant it was one retry away from standing up a second, real-cost,
# unmonitored ECS service nobody was tracking. Replaced with the deploy
# this repo has actually been running by hand all along: build+push the
# image, force a new deployment on the real service, wait for it to
# stabilize, then sync the static frontend to its S3 bucket.
#
# This does NOT run `terraform apply` - infrastructure changes stay a
# deliberate, human-run step (see terraform/README.md). Auto-applying
# infra changes on every push is a materially different risk than
# redeploying the application/frontend, and isn't something this
# workflow should decide on its own.

# Scoped to paths that actually affect the deployed app (what the
# Dockerfile COPYs in, plus the app's own tests and this workflow file) -
# a docs-only or terraform-only commit used to trigger a full
# rebuild+redeploy of unchanged app code for nothing. terraform/**
# deliberately stays out of this list; infra changes go through
# provision-infra.yml instead (see that workflow's own header comment).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "sample_documents/**"
      - "frontend/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-aws.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "sample_documents/**"
      - "frontend/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch: {}

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}

jobs:
  quality-gates:
    name: Tests, lint, type check, security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy src/

      - name: Security scan - source (bandit)
        run: uv run bandit -c pyproject.toml -r src/

      - name: Security scan - dependencies (pip-audit)
        run: uv run pip-audit --skip-editable

  docker-build-scan:
    name: Docker build and Trivy image scan
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (local only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: enterprise-rag-platform:scan

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: enterprise-rag-platform:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    needs: [quality-gates, docker-build-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-ecs-deploy-role
          role-session-name: GitHubActionsECSDeployment

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short commit hash
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Build, tag, and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"

      - name: Discover current ALB URL and update the ALB_URL variable
        id: discover-alb
        env:
          # The default GITHUB_TOKEN cannot write repo Variables even
          # with `permissions: actions: write` on the job (confirmed
          # live: 403 Resource not accessible by integration) - the
          # Variables API specifically needs a PAT with that permission,
          # which GITHUB_TOKEN structurally doesn't grant regardless of
          # the permissions block.
          GH_TOKEN: ${{ secrets.REPO_VARS_TOKEN }}
        # The single place this repo's real ALB URL gets discovered and
        # written down - every other step/workflow that needs it reads
        # the ALB_URL repo variable this sets, never re-derives its own
        # copy. Found necessary live: the ALB's auto-generated DNS
        # hostname changes its random suffix any time the load balancer
        # is recreated (a full infra teardown+reprovision), which
        # silently turned ALB_URL into a stale, dead URL - a real,
        # previously-hardcoded value nothing kept in sync. Runs on every
        # push-triggered deploy, so ALB_URL can never drift for more than
        # one deployment cycle even if the ALB is ever recreated again.
        run: |
          alb_dns=$(aws elbv2 describe-load-balancers \
            --region "${{ env.AWS_REGION }}" \
            --names "${{ env.ECR_REPOSITORY }}-alb" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          alb_url="http://$alb_dns"
          echo "resolved ALB URL: $alb_url"
          echo "alb_url=$alb_url" >> "$GITHUB_OUTPUT"

          if [ "$alb_url" != "${{ vars.ALB_URL }}" ]; then
            echo "ALB_URL changed (was '${{ vars.ALB_URL }}') - updating the repo variable"
            gh variable set ALB_URL --body "$alb_url"
          else
            echo "ALB_URL unchanged"
          fi

      - name: Wait for the service to stabilize
        # `aws ecs wait services-stable`'s fixed budget is 15s x 40
        # attempts = 10 minutes exactly, and the CLI doesn't expose a way
        # to widen it (no --waiter-config flag, confirmed) - found live to
        # be juuust too tight for this app's real cold start (image pull +
        # installing runtime deps + loading the embedding/reranker
        # models), which took ~10.5 minutes end to end even for a healthy,
        # zero-failed-task deployment (see health_check_grace_period_seconds
        # in terraform/ecs.tf for the fix that made deployments reliable at
        # all - this is a separate, CI-side timing issue). Polling
        # ourselves also means failing fast and loud on a real failed task
        # instead of only ever seeing a generic timeout either way.
        timeout-minutes: 20
        run: |
          while true; do
            rollout=$(aws ecs describe-services \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --services "${{ env.ECS_SERVICE }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'services[0].deployments[?status==`PRIMARY`]|[0].rolloutState' \
              --output text)
            failed=$(aws ecs describe-services \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --services "${{ env.ECS_SERVICE }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'services[0].deployments[?status==`PRIMARY`]|[0].failedTasks' \
              --output text)
            echo "rolloutState=$rollout failedTasks=$failed"

            if [ "$failed" != "0" ]; then
              echo "::error::deployment has $failed failed task(s)"
              exit 1
            fi

            if [ "$rollout" = "COMPLETED" ]; then
              echo "deployment stable"
              exit 0
            fi

            sleep 15
          done

      - name: Deploy frontend to S3
        # frontend/index.html carries __API_BASE_URL__ as a placeholder,
        # never a real hardcoded URL - substituted here from the same
        # single discovery in the step above, so the deployed frontend
        # always points at whatever ALB actually exists right now rather
        # than whatever happened to be committed at some point in the past.
        run: |
          sed "s|__API_BASE_URL__|${{ steps.discover-alb.outputs.alb_url }}|g" \
            frontend/index.html > /tmp/index.html
          aws s3 cp /tmp/index.html \
            "s3://${{ vars.FRONTEND_S3_BUCKET }}/index.html" \
            --region "${{ env.AWS_REGION }}"

      - name: Verify /health after deploy
        run: |
          alb_url="${{ steps.discover-alb.outputs.alb_url }}"
          status=$(curl -s -o /dev/null -w "%{http_code}" "$alb_url/health")
          echo "health check status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::/health returned $status after deploy (alb_url=$alb_url)"
            exit 1
          fi

      - name: Ensure the sample document is ingested
        # Idempotent, not blind re-ingestion on every push: the app has
        # no content-based dedup (a known gap - see CLAUDE.md's
        # "Duplicate document problem"), so calling /ingest unconditionally
        # on every deploy would create a fresh duplicate copy of the same
        # document every single time. Checks first via a real /ask query
        # that only returns sources when the AI-RMF PDF is actually
        # indexed, and only calls /ingest when that comes back empty -
        # true on a fresh/just-reprovisioned environment, a no-op
        # (skipped) on every routine code-only redeploy after that.
        run: |
          alb_url="${{ steps.discover-alb.outputs.alb_url }}"

          # Plain unsigned HTTPS to Cognito's own public InitiateAuth API -
          # same approach frontend/index.html already uses (no AWS
          # credentials needed for a public app client with no secret).
          # Deliberately not `aws cognito-idp initiate-auth`: that goes
          # through SigV4 and IAM authorization since it's a signed CLI
          # call, needing a permission grant this role has no other
          # reason to carry.
          token=$(curl -s "https://cognito-idp.${{ env.AWS_REGION }}.amazonaws.com/" \
            -H "Content-Type: application/x-amz-json-1.1" \
            -H "X-Amz-Target: AWSCognitoIdentityProviderService.InitiateAuth" \
            -d "{\"AuthFlow\":\"USER_PASSWORD_AUTH\",\"ClientId\":\"${{ vars.OIDC_AUDIENCE }}\",\"AuthParameters\":{\"USERNAME\":\"${{ secrets.COGNITO_TEST_USERNAME }}\",\"PASSWORD\":\"${{ secrets.COGNITO_TEST_PASSWORD }}\"}}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['AuthenticationResult']['IdToken'])")

          source_count=$(curl -s -X POST "$alb_url/ask" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            -d '{"query":"What is the AI RMF?","top_k":1}' \
            | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('sources', [])))")

          echo "existing sources for a known AI-RMF query: $source_count"

          if [ "$source_count" != "0" ]; then
            echo "sample document already indexed, skipping ingestion"
            exit 0
          fi

          echo "no existing content found - ingesting the sample document"
          ingest_response=$(curl -s -X POST "$alb_url/ingest" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            -d '{"file_paths": ["sample_documents/AI-RMF-1stdraft.pdf"]}')
          echo "$ingest_response"

          indexed_chunks=$(echo "$ingest_response" | python3 -c "import sys,json; print(json.load(sys.stdin).get('indexed_chunks', 0))")
          if [ "$indexed_chunks" = "0" ]; then
            echo "::error::ingestion reported 0 indexed chunks"
            exit 1
          fi
