name: Deploy to AWS (ECS Express Mode)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-ecs-deploy-role
          role-session-name: GitHubActionsECSDeployment

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short commit hash
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Build, tag, and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          execution-role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole
          task-role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/ecsTaskRole
          infrastructure-role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/ecsInfrastructureRoleForExpressServices
          cluster: ${{ env.ECS_CLUSTER }}
          container-port: 8000
          environment-variables: |
            [
              {"name": "RERANKER_ENABLED", "value": "true"},
              {"name": "EMBEDDING_PROVIDER", "value": "sentence_transformer"},
              {"name": "EMBEDDING_MODEL_NAME", "value": "BAAI/bge-base-en-v1.5"},
              {"name": "GENERATION_PROVIDER", "value": "${{ vars.GENERATION_PROVIDER }}"},
              {"name": "GENERATION_FALLBACK_PROVIDER", "value": "${{ vars.GENERATION_FALLBACK_PROVIDER }}"},
              {"name": "AWS_REGION", "value": "${{ env.AWS_REGION }}"},
              {"name": "BEDROCK_MODEL_ID", "value": "arn:aws:bedrock:${{ env.AWS_REGION }}:${{ env.AWS_ACCOUNT_ID }}:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0"},
              {"name": "LLM_BASE_URL", "value": "https://models.github.ai/inference"},
              {"name": "LLM_MODEL_NAME", "value": "openai/gpt-4o-mini"},
              {"name": "VECTOR_STORE_PROVIDER", "value": "opensearch"},
              {"name": "OPENSEARCH_HOST", "value": "${{ vars.OPENSEARCH_HOST }}"},
              {"name": "S3_BUCKET", "value": "${{ vars.S3_BUCKET }}"},
              {"name": "SQS_QUEUE_URL", "value": "${{ vars.SQS_QUEUE_URL }}"},
              {"name": "ASYNC_INGESTION_ENABLED", "value": "true"},
              {"name": "INGEST_ALLOWED_DIR", "value": "sample_documents"},
              {"name": "AUTH_ENABLED", "value": "true"},
              {"name": "OIDC_ISSUER", "value": "${{ vars.OIDC_ISSUER }}"},
              {"name": "OIDC_AUDIENCE", "value": "${{ vars.OIDC_AUDIENCE }}"},
              {"name": "OIDC_JWKS_URL", "value": "${{ vars.OIDC_JWKS_URL }}"},
              {"name": "RETRIEVAL_RELEVANCE_GUARD_ENABLED", "value": "true"}
            ]
          secrets: |
            [
              {"name": "LLM_API_KEY", "valueFrom": "${{ vars.LLM_API_KEY_SECRET_ARN }}"}
            ]
          cpu: '1024'
          memory: '4096'
          health-check-path: /health
          min-task-count: 1
          max-task-count: 2
          auto-scaling-metric: AVERAGE_CPU
          auto-scaling-target-value: 70
